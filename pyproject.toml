[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-ai-support-quality"
version = "1.0.0"
description = "A homelab platform for multi-agent evaluation of IT support assistants against documented procedures."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Clxnsy"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
  "PyYAML>=6.0,<7",
  "pandas>=2.2,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1"
]

[project.scripts]
northstar = "northstar.cli:app"

[tool.setuptools.packages.find]
include = ["northstar*"]

[tool.setuptools.package-data]
northstar = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
